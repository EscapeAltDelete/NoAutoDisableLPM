name: Build NoAutoDisableLPM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            architecture: iphoneos-arm64
            prefix: /var/jb
          - scheme: rootful
            architecture: iphoneos-arm
            prefix: ''
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Theos and SDK
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          brew install ldid xz dpkg make
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sdk.tar.xz" https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          xcodebuild -version

      - name: Build package
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          args=()
          if [[ "$SCHEME" == rootless ]]; then
            args+=(THEOS_PACKAGE_SCHEME=rootless)
          fi
          gmake -j2 package FINALPACKAGE=1 TARGET=iphone:clang:16.5:15.0 ARCHS='arm64 arm64e' "${args[@]}"

      - name: Validate package
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          shopt -s nullglob
          packages=(packages/*.deb)
          test "${#packages[@]}" -eq 1
          deb="${packages[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = com.joshuaseltzer.noautodisablelpm
          test "$(dpkg-deb -f "$deb" Architecture)" = "$EXPECTED_ARCH"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/package"
          base="$RUNNER_TEMP/package$PREFIX/Library/MobileSubstrate/DynamicLibraries/NoAutoDisableLPM"
          test -s "$base.dylib"
          test -s "$base.plist"
          lipo "$base.dylib" -verify_arch arm64 arm64e
          lipo "$base.dylib" -archs
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: NoAutoDisableLPM-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
          compression-level: 0
